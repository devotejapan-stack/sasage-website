<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEMBER REGISTRATION — SASAGE</title>
<style>

:root{--ink:#000;--ink-soft:#767676;--line:#e3e3e3;--navy:#0a1c33;--ls:.14em;}
*{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{font-family:"Helvetica Neue",Helvetica,Arial,"Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans KR",sans-serif;
  color:var(--ink);background:#fff;line-height:1.6;-webkit-font-smoothing:antialiased;}
img{display:block;max-width:100%;}
a{color:inherit;text-decoration:none;}

#pg-trans{position:fixed;inset:0;z-index:9999;background:var(--navy);opacity:0;pointer-events:none;
  transition:opacity .45s ease;display:flex;align-items:center;justify-content:center;}
#pg-trans.show{opacity:1;pointer-events:all;}
#pg-trans img{width:clamp(160px,44vw,260px);filter:brightness(0) invert(1);opacity:0;transform:scale(.86);
  transition:opacity .35s ease .15s,transform .35s ease .15s;}
#pg-trans.show img{opacity:.9;transform:scale(1);}

header{border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:100;}
.hdr-row{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 16px;gap:16px;}
.hdr-logo{cursor:pointer;}
.hdr-logo img{height:30px;width:auto;transition:opacity .25s;}
.hdr-logo:hover img{opacity:.55;}
.hdr-right{display:flex;align-items:center;gap:16px;}
.hdr-back{font-size:11px;letter-spacing:var(--ls);color:var(--ink-soft);white-space:nowrap;transition:color .2s;}
.hdr-back:hover{color:var(--ink);}

.lang-wrap{position:relative;display:inline-flex;align-items:center;}
.lang-btn{display:flex;align-items:center;gap:5px;background:none;border:1px solid var(--line);border-radius:2px;
  cursor:pointer;color:var(--ink);font-size:10px;letter-spacing:.16em;padding:5px 8px;line-height:1;
  font-family:inherit;transition:border-color .2s;}
.lang-btn:hover{border-color:var(--ink);}
.lang-caret{width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;
  border-top:3.5px solid currentColor;transition:transform .25s;}
.lang-wrap.open .lang-caret{transform:rotate(180deg);}
.lang-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:130px;background:#fff;border:1px solid var(--line);
  border-radius:2px;box-shadow:0 6px 24px rgba(0,0,0,.10);padding:4px 0;opacity:0;visibility:hidden;
  transform:translateY(-6px);transition:opacity .2s,transform .2s,visibility .2s;z-index:400;}
.lang-wrap.open .lang-menu{opacity:1;visibility:visible;transform:translateY(0);}
.lang-menu button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;
  border:none;cursor:pointer;color:var(--ink-soft);font-family:inherit;font-size:10px;letter-spacing:.12em;
  padding:9px 13px;text-align:left;transition:color .18s,background .18s;}
.lang-menu button:hover{color:var(--ink);background:#f7f7f7;}
.lang-menu button[aria-current="true"]{color:var(--ink);font-weight:600;}
.lang-menu .lang-native{font-size:9px;opacity:.55;letter-spacing:.04em;}

.wrap{max-width:640px;margin:0 auto;padding:clamp(46px,8vw,90px) 22px clamp(60px,9vw,110px);text-align:center;}
.eyebrow{font-size:10px;letter-spacing:.3em;color:var(--ink-soft);text-transform:uppercase;
  animation:up .6s cubic-bezier(.22,1,.36,1) both;}
h1{font-size:clamp(1.4rem,3vw,2rem);letter-spacing:.16em;font-weight:400;margin:14px 0 6px;
  animation:up .6s cubic-bezier(.22,1,.36,1) .06s both;}
.sub{font-size:13px;letter-spacing:.12em;color:var(--ink-soft);
  animation:up .6s cubic-bezier(.22,1,.36,1) .12s both;}
.rule{width:28px;height:1px;background:var(--ink);margin:26px auto;
  animation:rule .6s ease .2s both;}
.lead{font-size:12.5px;line-height:2.15;color:#3c3c3c;
  animation:up .6s cubic-bezier(.22,1,.36,1) .26s both;}

.benefits{list-style:none;margin:34px 0 0;border-top:1px solid var(--line);text-align:left;
  animation:up .6s cubic-bezier(.22,1,.36,1) .34s both;}
.benefits li{font-size:12.5px;color:#3c3c3c;padding:14px 0 14px 24px;border-bottom:1px solid var(--line);position:relative;}
.benefits li::before{content:"";position:absolute;left:3px;top:21px;width:9px;height:1px;background:var(--ink);}

.how{margin-top:40px;text-align:left;animation:up .6s cubic-bezier(.22,1,.36,1) .42s both;}
.how h2{font-size:9.5px;letter-spacing:.26em;color:var(--ink-soft);text-transform:uppercase;
  font-weight:400;margin-bottom:16px;text-align:center;}
.how ol{list-style:none;counter-reset:s;}
.how li{counter-increment:s;position:relative;padding:11px 0 11px 34px;font-size:12px;color:#3c3c3c;line-height:1.85;}
.how li::before{content:counter(s);position:absolute;left:0;top:12px;width:20px;height:20px;
  border:1px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:9.5px;color:var(--ink);}

.cta-wrap{margin-top:38px;animation:up .6s cubic-bezier(.22,1,.36,1) .5s both;}
.cta{display:block;width:100%;padding:18px;background:var(--ink);color:#fff;border:1px solid var(--ink);
  font-size:11px;letter-spacing:.26em;transition:background .28s,color .28s;}
.cta:hover{background:#fff;color:var(--ink);}
.cta-note{font-size:10.5px;color:var(--ink-soft);margin-top:11px;letter-spacing:.08em;}
.already{display:inline-block;margin-top:22px;font-size:11px;letter-spacing:.1em;color:var(--ink-soft);
  border-bottom:1px solid transparent;transition:color .2s,border-color .2s;}
.already:hover{color:var(--ink);border-bottom-color:var(--ink);}

.secure{display:flex;gap:10px;align-items:flex-start;text-align:left;margin-top:36px;padding-top:20px;
  border-top:1px solid var(--line);font-size:10.5px;line-height:1.95;color:var(--ink-soft);
  animation:up .6s cubic-bezier(.22,1,.36,1) .58s both;}
.secure svg{width:15px;height:15px;flex:none;margin-top:2px;stroke:var(--ink-soft);stroke-width:1.3;fill:none;}

@keyframes up{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
@keyframes rule{from{opacity:0;transform:scaleX(0);}to{opacity:1;transform:scaleX(1);}}

footer{border-top:1px solid var(--line);padding:26px 20px;text-align:center;}
footer a{font-size:11px;letter-spacing:var(--ls);color:var(--ink-soft);transition:color .2s;}
footer a:hover{color:var(--ink);}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
</style>
</head>

var LANG_CODE = { ja:'JA', en:'EN', ko:'KO' };

function setLang(lang){
  if(!I18N[lang]) lang='ja';
  var d=I18N[lang];
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var v=d[el.getAttribute('data-i18n')];
    if(v!==undefined){ if(v.indexOf('<')>-1) el.innerHTML=v; else el.textContent=v; }
  });
  document.documentElement.setAttribute('lang', lang);
  var cur=document.getElementById('lang-current');
  if(cur) cur.textContent=LANG_CODE[lang];
  document.querySelectorAll('#lang-menu button').forEach(function(b){
    b.setAttribute('aria-current', b.getAttribute('data-lang')===lang?'true':'false');
  });
  try{ localStorage.setItem('sasage_lang', lang); }catch(e){}
  closeLangMenu();
}
function toggleLangMenu(e){
  if(e) e.stopPropagation();
  var w=document.getElementById('lang-wrap'); if(!w) return;
  var o=w.classList.toggle('open');
  document.getElementById('lang-btn').setAttribute('aria-expanded', o?'true':'false');
}
function closeLangMenu(){
  var w=document.getElementById('lang-wrap'); if(!w) return;
  w.classList.remove('open');
  var b=document.getElementById('lang-btn'); if(b) b.setAttribute('aria-expanded','false');
}
document.addEventListener('click',function(e){
  var w=document.getElementById('lang-wrap');
  if(w && !w.contains(e.target)) closeLangMenu();
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeLangMenu(); });
(function(){
  var s=null; try{ s=localStorage.getItem('sasage_lang'); }catch(e){}
  if(!s){ var n=(navigator.language||'ja').toLowerCase();
    s = n.indexOf('ja')===0?'ja':(n.indexOf('ko')===0?'ko':'en'); }
  setLang(s);
})();

function goHome(e){
  if(e) e.preventDefault();
  var t=document.getElementById('pg-trans');
  document.getElementById('trans-logo').src=document.getElementById('logo-img').src;
  t.classList.add('show');
  setTimeout(function(){ window.location.href='index.html'; }, 620);
  return false;
}

/* Shopify's account screen opens in a separate tab, so this page survives.
   When the visitor comes back to this tab, send them on to the store. */
(function(){
  var RETURN_TO = 'store.html';
  var pending = false, openedAt = 0;

  var NOTE = {
    ja: '別タブで登録画面を開きました。完了後このタブに戻ると、自動的にストアへ移動します。',
    en: 'The registration screen opened in a new tab. Return to this tab when you are done and we will take you to the store.',
    ko: '새 탭에서 가입 화면을 열었습니다. 완료 후 이 탭으로 돌아오시면 자동으로 스토어로 이동합니다.'
  };

  function lang(){
    try{ return localStorage.getItem('sasage_lang') || 'ja'; }catch(e){ return 'ja'; }
  }

  function markPending(){
    pending = true;
    openedAt = Date.now();
    try{ localStorage.setItem('sasage_pending','1'); }catch(e){}
    var n = document.getElementById('return-note');
    if(n){ n.textContent = NOTE[lang()] || NOTE.ja; n.style.display = 'block'; }
  }

  ['cta','already'].forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.addEventListener('click', markPending);
  });

  function backToStore(){
    if(!pending) return;
    if(Date.now() - openedAt < 3000) return;
    pending = false;
    setTimeout(function(){ window.location.href = RETURN_TO; }, 400);
  }

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') backToStore();
  });
  window.addEventListener('focus', backToStore);
})();
