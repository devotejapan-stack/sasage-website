<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEMBER REGISTRATION — SASAGE</title>
<style>
:root{--ink:#000;--ink-soft:#767676;--line:#e3e3e3;--navy:#0a1c33;--ls:.14em;--err:#c0392b;}
*{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{font-family:"Helvetica Neue",Helvetica,Arial,"Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans KR",sans-serif;
  color:var(--ink);background:#fff;line-height:1.6;-webkit-font-smoothing:antialiased;}
img{display:block;max-width:100%;}
a{color:inherit;text-decoration:none;}

#pg-trans{position:fixed;inset:0;z-index:9999;background:var(--navy);opacity:0;pointer-events:none;
  transition:opacity .45s ease;display:flex;align-items:center;justify-content:center;}
#pg-trans.show{opacity:1;pointer-events:all;}
#pg-trans img{width:clamp(160px,44vw,260px);filter:brightness(0) invert(1);opacity:0;transform:scale(.86);
  transition:opacity .35s ease .15s,transform .35s ease .15s;}
#pg-trans.show img{opacity:.9;transform:scale(1);}

header{border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:100;}
.hdr-row{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 16px;gap:16px;}
.hdr-logo{cursor:pointer;}
.hdr-logo img{height:30px;width:auto;transition:opacity .25s;}
.hdr-logo:hover img{opacity:.55;}
.hdr-right{display:flex;align-items:center;gap:16px;}
.hdr-back{font-size:11px;letter-spacing:var(--ls);color:var(--ink-soft);white-space:nowrap;transition:color .2s;}
.hdr-back:hover{color:var(--ink);}

.lang-wrap{position:relative;display:inline-flex;align-items:center;}
.lang-btn{display:flex;align-items:center;gap:5px;background:none;border:1px solid var(--line);border-radius:2px;
  cursor:pointer;color:var(--ink);font-size:10px;letter-spacing:.16em;padding:5px 8px;line-height:1;
  font-family:inherit;transition:border-color .2s;}
.lang-btn:hover{border-color:var(--ink);}
.lang-caret{width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;
  border-top:3.5px solid currentColor;transition:transform .25s;}
.lang-wrap.open .lang-caret{transform:rotate(180deg);}
.lang-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:130px;background:#fff;border:1px solid var(--line);
  border-radius:2px;box-shadow:0 6px 24px rgba(0,0,0,.10);padding:4px 0;opacity:0;visibility:hidden;
  transform:translateY(-6px);transition:opacity .2s,transform .2s,visibility .2s;z-index:400;}
.lang-wrap.open .lang-menu{opacity:1;visibility:visible;transform:translateY(0);}
.lang-menu button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;
  border:none;cursor:pointer;color:var(--ink-soft);font-family:inherit;font-size:10px;letter-spacing:.12em;
  padding:9px 13px;text-align:left;transition:color .18s,background .18s;}
.lang-menu button:hover{color:var(--ink);background:#f7f7f7;}
.lang-menu button[aria-current="true"]{color:var(--ink);font-weight:600;}
.lang-menu .lang-native{font-size:9px;opacity:.55;letter-spacing:.04em;}

.wrap{max-width:1120px;margin:0 auto;padding:clamp(38px,6vw,76px) 20px clamp(56px,8vw,100px);}
.cols{display:grid;grid-template-columns:0.85fr 1fr;gap:clamp(34px,6vw,76px);align-items:start;}
@media(max-width:880px){.cols{grid-template-columns:1fr;gap:38px;}}

.eyebrow{font-size:10px;letter-spacing:.3em;color:var(--ink-soft);text-transform:uppercase;}
h1{font-size:clamp(1.4rem,2.7vw,1.95rem);letter-spacing:.16em;font-weight:400;margin:14px 0 6px;}
.sub{font-size:13px;letter-spacing:.12em;color:var(--ink-soft);}
.lead{font-size:12.5px;line-height:2.1;color:#3c3c3c;margin-top:24px;}
.benefits{list-style:none;margin-top:28px;border-top:1px solid var(--line);}
.benefits li{font-size:12.5px;letter-spacing:.03em;color:#3c3c3c;padding:14px 0 14px 24px;
  border-bottom:1px solid var(--line);position:relative;}
.benefits li::before{content:"";position:absolute;left:3px;top:21px;width:9px;height:1px;background:var(--ink);}
.note{font-size:11px;line-height:1.9;color:var(--ink-soft);margin-top:24px;}

.steps{list-style:none;display:flex;gap:0;margin-bottom:14px;}
.steps li{flex:1;display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.14em;
  color:#c4c4c4;transition:color .3s;}
.steps li.on,.steps li.done{color:var(--ink);}
.steps .dot{width:22px;height:22px;border:1px solid currentColor;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:10px;flex:none;transition:background .3s,color .3s;}
.steps li.done .dot{background:var(--ink);color:#fff;border-color:var(--ink);}
.steps li.on .dot{background:var(--ink);color:#fff;border-color:var(--ink);}
@media(max-width:520px){.steps li span:not(.dot){display:none;}.steps li{flex:none;}
  .steps{gap:14px;justify-content:center;}}
.bar{height:1px;background:var(--line);margin-bottom:30px;overflow:hidden;}
.bar i{display:block;height:100%;width:33.33%;background:var(--ink);
  transition:width .45s cubic-bezier(.4,0,.2,1);}

.card{border:1px solid var(--line);padding:clamp(24px,3.6vw,38px);position:relative;overflow:hidden;}
.card.hide{display:none;}
.pane{display:none;}
.pane.on{display:block;animation:slideIn .42s cubic-bezier(.22,1,.36,1) both;}
.pane.on.rev{animation-name:slideInRev;}
@keyframes slideIn{from{opacity:0;transform:translateX(26px);}to{opacity:1;transform:none;}}
@keyframes slideInRev{from{opacity:0;transform:translateX(-26px);}to{opacity:1;transform:none;}}
.pane-h{font-size:13px;letter-spacing:.18em;font-weight:400;margin-bottom:6px;}
.pane-lead{font-size:11.5px;line-height:1.95;color:var(--ink-soft);margin-bottom:24px;}
.pane-h + .field,.pane-h + .row2{margin-top:26px;}

.field{margin-bottom:20px;}
.field label{display:block;font-size:10.5px;letter-spacing:.18em;margin-bottom:8px;text-transform:uppercase;}
.field b.req,.field b.opt{font-weight:400;font-size:9px;letter-spacing:.08em;margin-left:7px;text-transform:none;}
.field b.req{color:var(--err);} .field b.opt{color:var(--ink-soft);}
.field input,.field select{width:100%;border:none;border-bottom:1px solid var(--line);padding:10px 2px;
  font-size:14px;font-family:inherit;color:var(--ink);background:none;border-radius:0;transition:border-color .2s;}
.field select{-webkit-appearance:none;appearance:none;cursor:pointer;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M2 4l4 4 4-4' fill='none' stroke='%23767676' stroke-width='1.2'/></svg>") no-repeat right 2px center;}
.field input::placeholder{color:#c9c9c9;}
.field input:focus,.field select:focus{outline:none;border-bottom-color:var(--ink);}
.field.invalid input{border-bottom-color:var(--err);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:480px){.row2{grid-template-columns:1fr;gap:0;}}
.err{display:none;font-size:11px;color:var(--err);margin-top:7px;}
.field.invalid .err{display:block;animation:shake .35s;}
#err-pay.on,#err-agree.on{display:block;animation:shake .35s;}
@keyframes shake{0%,100%{transform:none;}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}

.pays{display:grid;gap:10px;}
.pay{display:block;cursor:pointer;}
.pay input{position:absolute;opacity:0;pointer-events:none;}
.pay-b{display:block;border:1px solid var(--line);padding:15px 17px;transition:border-color .22s,background .22s;}
.pay-b b{display:block;font-size:12.5px;font-weight:400;letter-spacing:.06em;}
.pay-b i{display:block;font-style:normal;font-size:10.5px;color:var(--ink-soft);margin-top:4px;letter-spacing:.02em;}
.pay:hover .pay-b{border-color:#b5b5b5;}
.pay input:checked + .pay-b{border-color:var(--ink);background:#fafafa;}
.pay input:focus-visible + .pay-b{outline:2px solid var(--ink);outline-offset:2px;}

.secure{display:flex;gap:9px;align-items:flex-start;font-size:10.5px;line-height:1.85;color:var(--ink-soft);
  margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
.secure svg{width:15px;height:15px;flex:none;margin-top:2px;stroke:var(--ink-soft);stroke-width:1.3;fill:none;}

.agree{display:flex;align-items:flex-start;gap:10px;margin:22px 0 4px;cursor:pointer;}
.agree input{margin-top:3px;accent-color:var(--ink);width:14px;height:14px;flex:none;cursor:pointer;}
.agree span{font-size:11.5px;line-height:1.7;color:#3c3c3c;}

.acts{display:flex;justify-content:space-between;gap:12px;margin-top:28px;}
.btn{cursor:pointer;font-family:inherit;font-size:10.5px;letter-spacing:.24em;padding:15px 30px;
  border:1px solid var(--ink);transition:background .25s,color .25s,opacity .25s;}
.btn.primary{background:var(--ink);color:#fff;flex:1;}
.btn.primary:hover{background:#fff;color:var(--ink);}
.btn.ghost{background:none;color:var(--ink);}
.btn.ghost:hover{background:var(--ink);color:#fff;}

.done{display:none;text-align:center;padding:clamp(34px,5vw,56px) 14px;border:1px solid var(--line);}
.done.on{display:block;animation:fadeUp .55s cubic-bezier(.22,1,.36,1) both;}
.done .tick{width:46px;height:46px;border:1px solid var(--ink);border-radius:50%;margin:0 auto 22px;
  display:flex;align-items:center;justify-content:center;animation:pop .5s cubic-bezier(.22,1.4,.36,1) .15s both;}
.done .tick svg{width:20px;height:20px;stroke:var(--ink);stroke-width:1.4;fill:none;
  stroke-dasharray:26;stroke-dashoffset:26;animation:draw .5s ease .4s forwards;}
@keyframes draw{to{stroke-dashoffset:0;}}
@keyframes pop{from{opacity:0;transform:scale(.6);}to{opacity:1;transform:none;}}
.done h2{font-size:15px;letter-spacing:.14em;font-weight:400;margin-bottom:14px;}
.done p{font-size:12.5px;line-height:2;color:var(--ink-soft);max-width:27em;margin:0 auto 26px;}
.done a{display:inline-block;border:1px solid var(--ink);padding:13px 30px;font-size:10.5px;
  letter-spacing:.24em;transition:background .25s,color .25s;}
.done a:hover{background:var(--ink);color:#fff;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}

footer{border-top:1px solid var(--line);padding:26px 20px;text-align:center;}
footer a{font-size:11px;letter-spacing:var(--ls);color:var(--ink-soft);transition:color .2s;}
footer a:hover{color:var(--ink);}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
</style>
</head>

      <h1 data-i18n="page.title">MEMBER REGISTRATION</h1>
      <p class="sub" data-i18n="page.sub">会員登録</p>
      <p class="lead" data-i18n="page.lead"></p>
      <ul class="benefits">
        <li data-i18n="b.1"></li><li data-i18n="b.2"></li><li data-i18n="b.3"></li>
      </ul>
      <p class="note" data-i18n="note"></p>
    </aside>

    <div class="formcol">
      <ol class="steps" id="steps">
        <li class="on" data-step="1"><span class="dot">1</span><span data-i18n="step.1">基本情報</span></li>
        <li data-step="2"><span class="dot">2</span><span data-i18n="step.2">お届け先</span></li>

      </ol>
      <div class="bar"><i id="bar-fill"></i></div>

      <form class="card" id="reg-form" onsubmit="return submitReg(event)" novalidate>

        <section class="pane on" data-pane="1">
          <h2 class="pane-h" data-i18n="s1.title">基本情報</h2>
          <div class="field" data-for="reg-name">
            <label for="reg-name"><span data-i18n="f.name">お名前</span><b class="req" data-i18n="f.required">必須</b></label>
            <input type="text" id="reg-name" data-i18n-ph="f.name.ph" autocomplete="name">
            <p class="err" data-i18n="err.name"></p>
          </div>
          <div class="field" data-for="reg-kana">
            <label for="reg-kana"><span data-i18n="f.kana">フリガナ</span><b class="opt" data-i18n="f.optional">任意</b></label>
            <input type="text" id="reg-kana" data-i18n-ph="f.kana.ph">
            <p class="err" data-i18n="err.kana"></p>
          </div>
          <div class="field" data-for="reg-email">
            <label for="reg-email"><span data-i18n="f.email">メールアドレス</span><b class="req" data-i18n="f.required">必須</b></label>
            <input type="email" id="reg-email" data-i18n-ph="f.email.ph" autocomplete="email">
            <p class="err" data-i18n="err.email"></p>
          </div>
          <div class="acts">
            <span></span>
            <button type="button" class="btn primary" onclick="goStep(2)" data-i18n="btn.next">次へ進む</button>
          </div>
        </section>

        <section class="pane" data-pane="2">
          <h2 class="pane-h" data-i18n="s2.title">お届け先</h2>
          <div class="field" data-for="reg-country">
            <label for="reg-country"><span data-i18n="f.country">国・地域</span><b class="req" data-i18n="f.required">必須</b></label>
            <select id="reg-country">
              <option value="JP">日本 / Japan</option>
              <option value="KR">대한민국 / South Korea</option>
              <option value="US">United States</option>
              <option value="OTHER">その他 / Other</option>
            </select>
          </div>
          <div class="row2">
            <div class="field" data-for="reg-postal">
              <label for="reg-postal"><span data-i18n="f.postal">郵便番号</span><b class="req" data-i18n="f.required">必須</b></label>
              <input type="text" id="reg-postal" data-i18n-ph="f.postal.ph" autocomplete="postal-code">
              <p class="err" data-i18n="err.postal"></p>
            </div>
            <div class="field" data-for="reg-pref">
              <label for="reg-pref"><span data-i18n="f.pref">都道府県</span><b class="req" data-i18n="f.required">必須</b></label>
              <input type="text" id="reg-pref" data-i18n-ph="f.pref.ph" autocomplete="address-level1">
              <p class="err" data-i18n="err.pref"></p>
            </div>
          </div>
          <div class="field" data-for="reg-city">
            <label for="reg-city"><span data-i18n="f.city">市区町村</span><b class="req" data-i18n="f.required">必須</b></label>
            <input type="text" id="reg-city" data-i18n-ph="f.city.ph" autocomplete="address-level2">
            <p class="err" data-i18n="err.city"></p>
          </div>
          <div class="field" data-for="reg-addr1">
            <label for="reg-addr1"><span data-i18n="f.addr1">番地</span><b class="req" data-i18n="f.required">必須</b></label>
            <input type="text" id="reg-addr1" data-i18n-ph="f.addr1.ph" autocomplete="address-line1">
            <p class="err" data-i18n="err.addr1"></p>
          </div>
          <div class="field" data-for="reg-addr2">
            <label for="reg-addr2"><span data-i18n="f.addr2">建物名・部屋番号</span><b class="opt" data-i18n="f.optional">任意</b></label>
            <input type="text" id="reg-addr2" data-i18n-ph="f.addr2.ph" autocomplete="address-line2">
          </div>
          <div class="field" data-for="reg-phone">
            <label for="reg-phone"><span data-i18n="f.phone">電話番号</span><b class="req" data-i18n="f.required">必須</b></label>
            <input type="tel" id="reg-phone" data-i18n-ph="f.phone.ph" autocomplete="tel">
            <p class="err" data-i18n="err.phone"></p>
          </div>
          <div class="acts">
            <button type="button" class="btn ghost" onclick="goStep(1)" data-i18n="btn.back">戻る</button>
            <button type="button" class="btn primary" onclick="goStep(3)" data-i18n="btn.next">次へ進む</button>
          </div>
        </section>

        <section class="pane" data-pane="3">
          <h2 class="pane-h" data-i18n="s3.title">ご希望のお支払い方法</h2>
          <p class="pane-lead" data-i18n="pay.lead"></p>

var LANG_CODE = { ja:'JA', en:'EN', ko:'KO' };

function setLang(lang){
  if(!I18N[lang]) lang='ja';
  var d = I18N[lang];
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var v = d[el.getAttribute('data-i18n')];
    if(v !== undefined) el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(function(el){
    var v = d[el.getAttribute('data-i18n-ph')];
    if(v !== undefined) el.placeholder = v;
  });
  document.documentElement.setAttribute('lang', lang);
  var cur = document.getElementById('lang-current');
  if(cur) cur.textContent = LANG_CODE[lang];
  document.querySelectorAll('#lang-menu button').forEach(function(b){
    b.setAttribute('aria-current', b.getAttribute('data-lang')===lang ? 'true':'false');
  });
  try{ localStorage.setItem('sasage_lang', lang); }catch(e){}
  closeLangMenu();
}
function toggleLangMenu(e){
  if(e) e.stopPropagation();
  var w=document.getElementById('lang-wrap'); if(!w) return;
  var o=w.classList.toggle('open');
  document.getElementById('lang-btn').setAttribute('aria-expanded', o?'true':'false');
}
function closeLangMenu(){
  var w=document.getElementById('lang-wrap'); if(!w) return;
  w.classList.remove('open');
  var b=document.getElementById('lang-btn'); if(b) b.setAttribute('aria-expanded','false');
}
document.addEventListener('click',function(e){
  var w=document.getElementById('lang-wrap');
  if(w && !w.contains(e.target)) closeLangMenu();
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeLangMenu(); });
(function(){
  var s=null; try{ s=localStorage.getItem('sasage_lang'); }catch(e){}
  if(!s){ var n=(navigator.language||'ja').toLowerCase();
    s = n.indexOf('ja')===0 ? 'ja' : (n.indexOf('ko')===0 ? 'ko' : 'en'); }
  setLang(s);
})();

function goHome(e){
  e.preventDefault();
  var t=document.getElementById('pg-trans');
  document.getElementById('trans-logo').src=document.getElementById('logo-img').src;
  t.classList.add('show');
  setTimeout(function(){ window.location.href='index.html'; }, 620);
  return false;
}

/* ---- multi-step ---- */
var current = 1;
var REQ = {
  1:['reg-name','reg-email'],
  2:['reg-postal','reg-pref','reg-city','reg-addr1','reg-phone'],
  3:[]
};
function fieldOf(id){ return document.querySelector('.field[data-for="'+id+'"]'); }
function validId(id){
  var el=document.getElementById(id), v=el.value.trim();
  if(id==='reg-email') return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  return v.length>0;
}
function validateStep(n){
  var ok=true, first=null;
  REQ[n].forEach(function(id){
    var good=validId(id);
    var f=fieldOf(id);
    if(f) f.classList.toggle('invalid', !good);
    if(!good){ ok=false; if(!first) first=document.getElementById(id); }
  });
  if(n===3){
    var pay=document.querySelector('input[name="pay"]:checked');
    document.getElementById('err-pay').classList.toggle('on', !pay);
    if(!pay){ ok=false; if(!first) first=document.getElementById('pays'); }
    var ag=document.getElementById('reg-agree');
    document.getElementById('err-agree').classList.toggle('on', !ag.checked);
    if(!ag.checked){ ok=false; if(!first) first=ag; }
  }
  if(first && first.focus) try{ first.focus({preventScroll:true}); }catch(e){}
  return ok;
}
function goStep(n){
  if(n>current && !validateStep(current)) return;
  var rev = n < current;
  document.querySelectorAll('.pane').forEach(function(p){ p.classList.remove('on','rev'); });
  var pane=document.querySelector('.pane[data-pane="'+n+'"]');
  if(rev) pane.classList.add('rev');
  pane.classList.add('on');
  document.querySelectorAll('#steps li').forEach(function(li){
    var s=+li.getAttribute('data-step');
    li.classList.toggle('on', s===n);
    li.classList.toggle('done', s<n);
  });
  document.getElementById('bar-fill').style.width = (n*33.333)+'%';
  current=n;
  var top=document.querySelector('.formcol').getBoundingClientRect().top+window.scrollY-90;
  window.scrollTo({top:top<0?0:top, behavior:'smooth'});
}
function saveMember(){
  var v=function(id){ var el=document.getElementById(id); return el?el.value.trim():''; };
  var payEl=document.querySelector('input[name="pay"]:checked');
  var data={
    name:v('reg-name'), kana:v('reg-kana'), email:v('reg-email'),
    country:v('reg-country'), postal:v('reg-postal'), pref:v('reg-pref'),
    city:v('reg-city'), addr1:v('reg-addr1'), addr2:v('reg-addr2'),
    phone:v('reg-phone'), pay:payEl?payEl.value:'',
    joined:new Date().toISOString()
  };
  try{ localStorage.setItem('sasage_member', JSON.stringify(data)); }catch(e){}
}

function prefillFromSaved(){
  var m=null;
  try{ m=JSON.parse(localStorage.getItem('sasage_member')||'null'); }catch(e){}
  if(!m) return;
  var set=function(id,val){ var el=document.getElementById(id); if(el&&val) el.value=val; };
  set('reg-name',m.name); set('reg-kana',m.kana); set('reg-email',m.email);
  set('reg-country',m.country); set('reg-postal',m.postal); set('reg-pref',m.pref);
  set('reg-city',m.city); set('reg-addr1',m.addr1); set('reg-addr2',m.addr2);
  set('reg-phone',m.phone);
  if(m.pay){
    var r=document.querySelector('input[name="pay"][value="'+m.pay+'"]');
    if(r) r.checked=true;
  }
}
prefillFromSaved();

function submitReg(e){
  e.preventDefault();
  if(!validateStep(3)) return false;
  saveMember();
  document.getElementById('reg-form').classList.add('hide');
  document.getElementById('reg-done').classList.add('on');
  document.querySelectorAll('#steps li').forEach(function(li){ li.classList.add('done'); li.classList.remove('on'); });
  document.getElementById('bar-fill').style.width='100%';
  var top=document.querySelector('.formcol').getBoundingClientRect().top+window.scrollY-90;
  window.scrollTo({top:top<0?0:top, behavior:'smooth'});
  return false;
}
document.querySelectorAll('.field input').forEach(function(el){
  el.addEventListener('input', function(){
    var f=this.closest('.field'); if(f) f.classList.remove('invalid');
  });
});
document.querySelectorAll('input[name="pay"]').forEach(function(r){
  r.addEventListener('change', function(){ document.getElementById('err-pay').classList.remove('on'); });
});
document.getElementById('reg-agree').addEventListener('change', function(){
  if(this.checked) document.getElementById('err-agree').classList.remove('on');
});

</script>
