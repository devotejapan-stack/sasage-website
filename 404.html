<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ページが見つかりません — SASAGE</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@200;300&family=Noto+Serif+JP:wght@200;300&display=swap" rel="stylesheet">

<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:#0a1c33;color:#f0ece5;
    font-family:'Noto Serif JP',"Hiragino Mincho ProN","Yu Mincho",serif;
    display:flex;align-items:center;justify-content:center;
    padding:40px 22px;text-align:center;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:520px;width:100%;}
  .code{font-family:'Cormorant Garamond',serif;font-weight:200;
    font-size:clamp(64px,16vw,120px);line-height:1;letter-spacing:.06em;
    opacity:.28;margin-bottom:26px;}
  .eyebrow{font-size:10px;letter-spacing:.44em;text-indent:.44em;
    color:#ff5f00;margin-bottom:22px;}
  h1{font-family:'Cormorant Garamond',serif;font-weight:300;
    font-size:clamp(19px,4.6vw,27px);letter-spacing:.16em;
    line-height:1.7;margin-bottom:18px;}
  .rule{width:44px;height:1px;background:#ff5f00;margin:0 auto 24px;}
  p.lead{font-size:13px;line-height:2.15;opacity:.68;margin:0 auto 40px;max-width:30em;}
  .links{display:flex;flex-direction:column;gap:14px;align-items:center;}
  a{display:inline-block;min-width:250px;padding:15px 26px;
    font-size:11.5px;letter-spacing:.24em;text-decoration:none;
    color:#0a1c33;background:#f0ece5;transition:opacity .25s ease;}
  a.ghost{background:transparent;color:#f0ece5;border:1px solid rgba(240,236,229,.34);}
  a:hover{opacity:.78;}
  @media (max-width:480px){ a{min-width:0;width:100%;} p.lead{font-size:12px;} }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <div class="eyebrow">PAGE NOT FOUND</div>
    <h1>お探しのページは<br>見つかりませんでした</h1>
    <div class="rule"></div>
    <p class="lead">
      アドレスが変更されたか、削除された可能性があります。<br>
      下記より、あらためてお進みください。
    </p>
    <div class="links">
      <a href="/store.html">ストアを見る</a>
      <a class="ghost" href="/">ホームへ戻る</a>
    </div>
  </div>
</body>
